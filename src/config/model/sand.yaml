name: sand
# --- Architecture (defaults follow the STraTS MIMIC-III SAND run) ---
d_inp: 387         # time-series input dim per timestep = 3V (129 vars x values/obs/delta)
T: 24              # hourly bins (first 24h of ICU stay)
d_static: 2        # static features: Age, Gender
hid_dim: 64        # transformer hidden dimension
num_heads: 4       # attention heads (must divide hid_dim)
num_layers: 4      # transformer blocks
r: 24              # attention band: t attends to t-r..t (24 = full causal)
M: 12              # dense-interpolation steps -> feature dim hid_dim*M + hid_dim
use_static: True   # concat the demo (Age, Gender) embedding; False = time series only
d_static_out: null # null = STraTS demo embedding (hid_dim wide, linear output; all runs
                   # before 2026-10-11). An int narrows it to that width + output Tanh,
                   # as model=lstm (wandb name gets _demo{N}, e.g. mimic3_pheno_t08_demo2)
attn_fix: False    # False = STraTS attention, which never applies the attention weights
                   # (o_t = v_t + a head/time shuffle; all runs before 2026-10-11).
                   # True = real banded causal self-attention (wandb name gets _attnfix)
# --- Bayesian ---
dropout_p: 0.2
k: 10
# --- Optimiser ---
weight_decay: 1.0e-5
learning_rate: 0.0005
# --- Framework flags ---
use_ema: False
exclude_bn_bias: False
small_head: False
weighted_loss: False
load_pretrained: Null
freeze_encoder: False
finetune: False
