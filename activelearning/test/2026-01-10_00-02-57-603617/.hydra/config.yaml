trainer:
  seed: 12345
  batch_size: 64
  num_workers: 16
  persistent_workers: true
  max_epochs: 200
  min_epochs: 50
  fast_dev_run: false
  data_root: ${oc.env:DATA_ROOT}
  experiments_root: ${oc.env:EXPERIMENT_ROOT}/activelearning
  experiment_name: test
  experiment_id: ${now:%Y-%m-%d_%H-%M-%S-%f}
  n_gpus: 1
  check_val_every_n_epoch: 1
  progress_bar_refresh_rate: 1
  gradient_clip_val: 0
  early_stop: false
  precision: 32
  deterministic: false
  profiler: null
  load_best_ckpt: true
  save_last: false
  timeout: 60
  run_test: true
data:
  name: mnist
  shape:
  - 28
  - 28
  - 1
  num_classes: 10
  val_split: 100
  mean:
  - 0.1307
  std:
  - 0.3081
  transform_train: basic
  transform_test: basic
optim:
  optimizer:
    name: adam
    momentum: 0.9
  lr_scheduler:
    name: steplr
model:
  name: bayesian_mnist
  weight_decay: 0
  learning_rate: 0.001
  load_pretrained: null
  freeze_encoder: false
  use_ema: false
  exclude_bn_bias: true
  k: 50
  finetune: false
active:
  num_labelled: 1000
  min_train: 5500
  balanced: true
  acq_size: 1000
  num_iter: 10
  random_split: true
  m: null
query:
  query:
    name: vendi
    vendi:
      batch_size: 64
      normalization: minmax
      q: 1.0
      gamma: 1.0
  name: bandit
  bandit:
    alpha: 1.0
    contexts:
      unc:
      - bald_q
      - bald_rest
      div:
      - vendi_q
      - vendi_q_l
