hydra:
  run:
    dir: ${trainer.experiments_root}/${trainer.experiment_name}/${trainer.experiment_id}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=sand
    - query=random
    - data=mimic3_sand_baleval
    - active=mimic3_med
    - optim=adam
    - ++data.balanced_sampling=False
    - ++model.weighted_loss=True
    - ++trainer.seed=12345
    - ++trainer.max_epochs=50
    - ++model.dropout_p=0.2
    - ++model.learning_rate=0.0005
    - ++model.weight_decay=1e-05
    - ++model.use_ema=False
    - ++trainer.batch_size=64
    - ++trainer.precision=32
    - ++trainer.deterministic=True
    - ++trainer.experiment_name=mimic3_sand_baleval/active-mimic3_med/20260728-73bd8837/model-sand_drop-0.2_acq-random_ep-50_wl-True
  job:
    name: main
    chdir: null
    override_dirname: ++data.balanced_sampling=False,++model.dropout_p=0.2,++model.learning_rate=0.0005,++model.use_ema=False,++model.weight_decay=1e-05,++model.weighted_loss=True,++trainer.batch_size=64,++trainer.deterministic=True,++trainer.experiment_name=mimic3_sand_baleval/active-mimic3_med/20260728-73bd8837/model-sand_drop-0.2_acq-random_ep-50_wl-True,++trainer.max_epochs=50,++trainer.precision=32,++trainer.seed=12345,active=mimic3_med,data=mimic3_sand_baleval,model=sand,optim=adam,query=random
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.1'
    cwd: /home/jing/Desktop/realistic-al
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jing/Desktop/realistic-al/src/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/jing/Desktop/realistic-al/experiments/activelearning/mimic3_sand_baleval/active-mimic3_med/20260728-73bd8837/model-sand_drop-0.2_acq-random_ep-50_wl-True/2026-07-28_23-39-21-205645
    choices:
      query: random
      active: mimic3_med
      model: sand
      optim: adam
      data: mimic3_sand_baleval
      trainer: base
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
