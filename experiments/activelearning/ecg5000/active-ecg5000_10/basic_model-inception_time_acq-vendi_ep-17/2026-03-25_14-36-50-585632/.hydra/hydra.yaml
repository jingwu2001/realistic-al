hydra:
  run:
    dir: ${trainer.experiments_root}/${trainer.experiment_name}/${trainer.experiment_id}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=inception_time
    - query=vendi
    - data=ecg5000
    - active=ecg5000_10
    - optim=adam
    - ++data.val_size=500
    - ++trainer.seed=12347
    - ++trainer.max_epochs=17
    - ++model.dropout_p=0.5
    - ++model.learning_rate=0.0001442986898059786
    - ++trainer.precision=32
    - ++trainer.batch_size=8
    - ++trainer.deterministic=True
    - ++model.weighted_loss=True
    - ++query.vendi.kernel=rbf
    - ++query.vendi.gamma=1.0
    - ++query.vendi.normalization=minmax
    - ++query.bandit.num_classes=5
    - ++trainer.experiment_name=ecg5000/active-ecg5000_10/basic_model-inception_time_acq-vendi_ep-17
  job:
    name: main
    chdir: null
    override_dirname: ++data.val_size=500,++model.dropout_p=0.5,++model.learning_rate=0.0001442986898059786,++model.weighted_loss=True,++query.bandit.num_classes=5,++query.vendi.gamma=1.0,++query.vendi.kernel=rbf,++query.vendi.normalization=minmax,++trainer.batch_size=8,++trainer.deterministic=True,++trainer.experiment_name=ecg5000/active-ecg5000_10/basic_model-inception_time_acq-vendi_ep-17,++trainer.max_epochs=17,++trainer.precision=32,++trainer.seed=12347,active=ecg5000_10,data=ecg5000,model=inception_time,optim=adam,query=vendi
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.1'
    cwd: /home/jing/Desktop/realistic-al
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jing/Desktop/realistic-al/src/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/jing/Desktop/realistic-al/experiments/activelearning/ecg5000/active-ecg5000_10/basic_model-inception_time_acq-vendi_ep-17/2026-03-25_14-36-50-585632
    choices:
      query: vendi
      active: ecg5000_10
      model: inception_time
      optim: adam
      data: ecg5000
      trainer: base
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
