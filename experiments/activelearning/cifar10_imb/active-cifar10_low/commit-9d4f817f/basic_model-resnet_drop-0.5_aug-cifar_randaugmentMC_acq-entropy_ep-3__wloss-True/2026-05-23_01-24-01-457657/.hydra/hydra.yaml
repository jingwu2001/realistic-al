hydra:
  run:
    dir: ${trainer.experiments_root}/${trainer.experiment_name}/${trainer.experiment_id}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=resnet
    - query=entropy
    - data=cifar10_imb
    - active=cifar10_low
    - optim=sgd_cosine
    - ++model.weighted_loss=True
    - ++data.val_size=250
    - ++trainer.seed=12345
    - ++trainer.max_epochs=3
    - ++model.weight_decay=0.005
    - ++model.dropout_p=0.5
    - ++model.learning_rate=0.1
    - ++model.use_ema=False
    - ++data.transform_train=cifar_randaugmentMC
    - ++trainer.batch_size=1024
    - ++trainer.precision=16
    - ++trainer.deterministic=True
    - ++active.num_iter=2
    - ++trainer.experiment_name=cifar10_imb/active-cifar10_low/commit-9d4f817f/basic_model-resnet_drop-0.5_aug-cifar_randaugmentMC_acq-entropy_ep-3__wloss-True
  job:
    name: main
    chdir: null
    override_dirname: ++active.num_iter=2,++data.transform_train=cifar_randaugmentMC,++data.val_size=250,++model.dropout_p=0.5,++model.learning_rate=0.1,++model.use_ema=False,++model.weight_decay=0.005,++model.weighted_loss=True,++trainer.batch_size=1024,++trainer.deterministic=True,++trainer.experiment_name=cifar10_imb/active-cifar10_low/commit-9d4f817f/basic_model-resnet_drop-0.5_aug-cifar_randaugmentMC_acq-entropy_ep-3__wloss-True,++trainer.max_epochs=3,++trainer.precision=16,++trainer.seed=12345,active=cifar10_low,data=cifar10_imb,model=resnet,optim=sgd_cosine,query=entropy
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.1'
    cwd: /home/jing/Desktop/realistic-al
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jing/Desktop/realistic-al/src/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/jing/Desktop/realistic-al/experiments/activelearning/cifar10_imb/active-cifar10_low/commit-9d4f817f/basic_model-resnet_drop-0.5_aug-cifar_randaugmentMC_acq-entropy_ep-3__wloss-True/2026-05-23_01-24-01-457657
    choices:
      query: entropy
      active: cifar10_low
      model: resnet
      optim: sgd_cosine
      data: cifar10_imb
      trainer: base
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
